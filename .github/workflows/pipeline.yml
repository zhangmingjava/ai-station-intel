name: 每周数据管道
on:
  schedule:
    - cron: "0 2 * * 1"   # 每周一 02:00 UTC（北京 10 点）
  workflow_dispatch: {}    # 支持手动触发

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 跑全流程
        env:
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          PH_ACCESS_TOKEN: ${{ secrets.PH_ACCESS_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          python pipeline.py all --limit 200
          python pipeline.py classify --limit 60
      - name: 提交数据
        run: |
          git config user.name "pipeline-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ docs/
          git commit -m "weekly data update $(date +%F)" || echo "nothing to commit"
          git push
